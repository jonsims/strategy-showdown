<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Moonshot Moment</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F0F0F0; color: #333; min-height: 100vh; }
  header { background: #00694E; color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.2rem; }
  header .badge { background: #C5A033; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card h2 { font-size: 1.05rem; color: #00694E; margin-bottom: 12px; }
  #pin-gate { text-align: center; padding: 60px 20px; }
  #pin-gate h2 { font-size: 1.4rem; margin-bottom: 20px; color: #00694E; }
  #pin-input { font-size: 2rem; text-align: center; width: 200px; padding: 12px; border: 2px solid #ddd; border-radius: 10px; letter-spacing: 8px; }
  #pin-input:focus { outline: none; border-color: #00694E; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { padding: 12px 20px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; min-height: 44px; }
  .btn-warning { background: #C5A033; color: white; }
  .btn-warning:hover { background: #b08e28; }
  .btn-danger { background: #c0392b; color: white; }
  .btn-danger:hover { background: #a93226; }
  .btn-outline { background: white; color: #00694E; border: 2px solid #00694E; }
  .btn-outline:hover { background: #f0faf6; }
  .team-config { display: flex; align-items: center; gap: 12px; }
  .team-config select { padding: 8px 12px; font-size: 1rem; border: 2px solid #ddd; border-radius: 8px; }
  .stat-box { background: #f8f8f8; padding: 20px; border-radius: 10px; text-align: center; }
  .stat-box .number { font-size: 2.5rem; font-weight: 700; color: #00694E; }
  .stat-box .label { font-size: 0.85rem; color: #777; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { text-align: left; padding: 8px; border-bottom: 2px solid #ddd; color: #555; font-size: 0.78rem; text-transform: uppercase; }
  td { padding: 8px; border-bottom: 1px solid #eee; }
  tr:hover td { background: #f8f8f8; }
  .leverage-badge-sm { display: inline-block; color: white; padding: 2px 7px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; }
  .lv-parameters { background: #7f8c8d; }
  .lv-feedbacks { background: #2980b9; }
  .lv-design { background: #C5A033; }
  .lv-intent { background: #16a085; }
  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <h1>Moonshot Moment &mdash; Admin</h1>
  <span class="badge" id="counter-badge">0 moonshots</span>
</header>

<!-- PIN GATE -->
<div id="pin-gate" class="container">
  <div class="card">
    <h2>Enter Admin PIN</h2>
    <input type="password" id="pin-input" maxlength="4" inputmode="numeric" autofocus>
    <p style="margin-top:12px;color:#999;font-size:0.85rem;">Hint: The year of Microsoft's pledge</p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel" class="container hidden">

  <div class="card">
    <h2>Session Controls</h2>
    <div class="controls">
      <button class="btn btn-warning" id="btn-dummy">Load Dummy Data</button>
      <button class="btn btn-danger" id="btn-reset">Reset All</button>
    </div>
    <div style="margin-top:16px;">
      <div class="team-config">
        <span style="font-weight:600;font-size:0.9rem;">Number of teams:</span>
        <select id="team-count">
          <option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option selected>8</option><option>9</option><option>10</option>
          <option>12</option><option>14</option><option>16</option><option>20</option>
        </select>
        <button class="btn btn-outline" id="btn-set-teams" style="padding:8px 16px;">Update</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Student Links</h2>
    <div style="font-size:0.9rem;">
      <strong>Moonshot page:</strong>
      <a id="moonshot-link" href="/moonshot.html" target="_blank" style="color:#00694E;font-weight:600;"></a>
      <br><br>
      <strong>Display page:</strong>
      <a id="display-link" href="/display.html" target="_blank" style="color:#00694E;font-weight:600;"></a>
    </div>
  </div>

  <div class="stat-box" style="margin-bottom:16px;">
    <div class="number" id="stat-moonshots">0</div>
    <div class="label">Moonshots Submitted (of <span id="stat-teams">8</span> teams)</div>
  </div>

  <div class="card">
    <h2>Moonshot Submissions</h2>
    <table>
      <thead><tr><th>Team</th><th>Year</th><th>Goal</th><th>Leverage</th><th>Cost Bearer</th><th>Metric</th><th>Target</th><th>Funding</th></tr></thead>
      <tbody id="tbl-moonshots"></tbody>
    </table>
  </div>
</div>

<script>
(function() {
  let pin = '';
  let authenticated = false;

  document.getElementById('pin-input').addEventListener('input', function() {
    if (this.value.length === 4) { pin = this.value; tryAuth(); }
  });

  async function tryAuth() {
    try {
      const res = await fetch('/admin/state?pin=' + encodeURIComponent(pin));
      if (res.ok) {
        authenticated = true;
        document.getElementById('pin-gate').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        const base = window.location.origin;
        document.getElementById('moonshot-link').textContent = base + '/moonshot.html';
        document.getElementById('moonshot-link').href = base + '/moonshot.html';
        document.getElementById('display-link').textContent = base + '/display.html';
        document.getElementById('display-link').href = base + '/display.html';
        poll();
        setInterval(poll, 2000);
      } else {
        alert('Wrong PIN');
        document.getElementById('pin-input').value = '';
      }
    } catch(e) { alert('Connection error'); }
  }

  document.getElementById('btn-dummy').addEventListener('click', async () => {
    if (!confirm('Load dummy data? This will reset current data.')) return;
    await fetch('/admin/load-dummy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
    poll();
  });

  document.getElementById('btn-reset').addEventListener('click', async () => {
    if (!confirm('Reset ALL data? This cannot be undone.')) return;
    await fetch('/admin/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
    poll();
  });

  document.getElementById('btn-set-teams').addEventListener('click', async () => {
    const n = document.getElementById('team-count').value;
    await fetch('/admin/set-teams', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin, numTeams: parseInt(n) }) });
    poll();
  });

  const leverageClassMap = { 'Parameters': 'lv-parameters', 'Feedbacks': 'lv-feedbacks', 'Design': 'lv-design', 'Intent': 'lv-intent' };

  function getLeverageBadge(level) {
    if (!level) return '';
    return `<span class="leverage-badge-sm ${leverageClassMap[level] || 'lv-parameters'}">${esc(level)}</span>`;
  }

  async function poll() {
    if (!authenticated) return;
    try {
      const res = await fetch('/admin/state?pin=' + encodeURIComponent(pin));
      const data = await res.json();

      const count = Object.keys(data.moonshots).length;
      document.getElementById('counter-badge').textContent = count + ' moonshot' + (count !== 1 ? 's' : '');
      document.getElementById('stat-moonshots').textContent = count;
      document.getElementById('stat-teams').textContent = data.numTeams;
      document.getElementById('team-count').value = data.numTeams;

      const tbl = document.getElementById('tbl-moonshots');
      tbl.innerHTML = Object.values(data.moonshots).map(m =>
        `<tr><td>Team ${m.teamId}</td><td>${m.year}</td>` +
        `<td>${esc(m.goal)}</td>` +
        `<td>${getLeverageBadge(m.leverageLevel)}</td>` +
        `<td style="color:#c0392b;font-size:0.82rem;">${esc(m.costBearer || '')}</td>` +
        `<td>${esc(m.metric)}</td>` +
        `<td>${esc(m.targetNumber)}</td><td>${esc(m.funding)}</td></tr>`
      ).join('') || '<tr><td colspan="8" style="text-align:center;color:#999;padding:20px;">No submissions yet</td></tr>';
    } catch(e) { /* silent */ }
  }

  function esc(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
})();
</script>
</body>
</html>
