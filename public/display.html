<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonshot Display - Strategy Showdown</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F0F0F0; color: #333; min-height: 100vh;
  }
  .header {
    background: #00694E; color: white;
    padding: 20px 40px; display: flex;
    align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 2rem; font-weight: 800; }
  .header .counter {
    background: #C5A033; padding: 8px 24px; border-radius: 30px;
    font-size: 1.1rem; font-weight: 700;
  }
  .body { padding: 30px 40px; }

  /* Moonshot grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 24px;
  }
  .card {
    background: white; border-radius: 16px; padding: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    border-left: 6px solid #00694E;
    animation: slideIn 0.5s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: none; } }
  .card .team-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
  }
  .card .team-name { font-size: 1.3rem; font-weight: 800; color: #00694E; }
  .card .year-badge {
    background: #C5A033; color: white; padding: 4px 14px;
    border-radius: 20px; font-weight: 700; font-size: 1rem;
  }
  .card .goal { font-size: 1.15rem; line-height: 1.4; margin-bottom: 12px; color: #333; }
  .card .cost-line {
    font-size: 0.95rem; color: #c0392b; font-weight: 600;
    margin-bottom: 14px; padding: 6px 10px;
    background: rgba(192,57,43,0.06); border-radius: 6px;
  }
  .card .key-number {
    background: #f0f8f5; border: 2px solid #00694E; border-radius: 10px;
    padding: 12px 16px; text-align: center; margin-bottom: 12px;
  }
  .card .key-number .value { font-size: 1.6rem; font-weight: 800; color: #00694E; }
  .card .key-number .metric-label { font-size: 0.8rem; color: #777; }
  .card .funding-line {
    font-size: 0.9rem; color: #555;
    padding-top: 8px; border-top: 1px solid #eee;
  }
  .card .funding-line strong { color: #C5A033; }
  .leverage-badge {
    display: inline-block; color: white; padding: 3px 10px;
    border-radius: 12px; font-size: 0.78rem; font-weight: 700;
  }
  .lv-Parameters { background: #7f8c8d; }
  .lv-Feedbacks { background: #2980b9; }
  .lv-Design { background: #C5A033; }
  .lv-Intent { background: #16a085; }
  .waiting {
    text-align: center; padding: 80px 20px; color: #999; font-size: 1.3rem;
  }
  .waiting .icon { font-size: 3rem; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="header">
  <h1>Moonshot Moment</h1>
  <span class="counter" id="counter">0 of 0 teams</span>
</div>

<div class="body">
  <div class="grid" id="grid">
    <div class="waiting">
      <div class="icon">&#x1F680;</div>
      <p>Waiting for team moonshots...</p>
    </div>
  </div>
</div>

<script>
(function() {
  function esc(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  async function poll() {
    try {
      const res = await fetch('/api/state');
      const data = await res.json();
      const moonshots = data.moonshots || {};
      const teamIds = Object.keys(moonshots).map(Number).sort((a, b) => a - b);
      const numTeams = data.numTeams || 8;

      document.getElementById('counter').textContent = teamIds.length + ' of ' + numTeams + ' teams';

      const grid = document.getElementById('grid');
      if (teamIds.length === 0) {
        grid.innerHTML = '<div class="waiting"><div class="icon">&#x1F680;</div><p>Waiting for team moonshots...</p></div>';
        return;
      }

      grid.innerHTML = teamIds.map(tid => {
        const ms = moonshots[tid];
        const lvClass = 'lv-' + esc(ms.leverageLevel);
        return '<div class="card">' +
          '<div class="team-header">' +
            '<div class="team-name">Team ' + tid + '</div>' +
            '<div style="display:flex;align-items:center;gap:8px;">' +
              '<span class="leverage-badge ' + lvClass + '">' + esc(ms.leverageLevel) + '</span>' +
              '<div class="year-badge">' + esc(ms.year) + '</div>' +
            '</div>' +
          '</div>' +
          (ms.teammates ? '<div style="font-size:0.85rem;color:#777;margin-bottom:8px;">' + esc(ms.teammates) + '</div>' : '') +
          '<div class="goal">' + esc(ms.goal) + '</div>' +
          '<div class="cost-line">Who bears the cost? ' + esc(ms.costBearer) + '</div>' +
          '<div class="key-number">' +
            '<div class="value">' + esc(ms.targetNumber) + '</div>' +
            '<div class="metric-label">' + esc(ms.metric) + '</div>' +
          '</div>' +
          '<div class="funding-line"><strong>Funding:</strong> ' + esc(ms.funding) + '</div>' +
        '</div>';
      }).join('');
    } catch(e) { console.error('Poll error:', e); }
  }

  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
